    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'Outfit', 'Cairo', sans-serif;
            background-color: #060208;
            color: #ffffff;
            overflow-x: hidden;
            width: 100vw;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
        }

        /* Ambient glowing atmosphere */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 95vw;
            max-width: 750px;
            height: 95vw;
            max-height: 750px;
            background: radial-gradient(circle, var(--theme-glow-color, rgba(255, 42, 95, 0.22)) 0%, rgba(136, 14, 79, 0.08) 50%, rgba(6, 2, 8, 0) 75%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            transition: background 0.8s ease;
            animation: pulse-glow 3s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
        }

        /* Title beating heart icon */
        .title-heart {
            display: inline-block;
            color: var(--theme-primary, #ff2a5f);
            filter: drop-shadow(0 0 12px var(--theme-primary, #ff2a5f));
            animation: heart-beat 1.2s infinite ease-in-out;
        }

        @keyframes heart-beat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.25); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }

        /* Love Phrase Item Styling - Clear and Uncrowded */
        .love-phrase {
            position: absolute;
            transform: translate(-50%, -50%) scale(0.3);
            font-weight: 600;
            white-space: nowrap;
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease, color 0.3s ease, text-shadow 0.3s ease;
            cursor: pointer;
            user-select: none;
            z-index: 10;
            padding: 1px 3px;
            border-radius: 4px;
            line-height: 1;
        }

        .love-phrase.revealed {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .love-phrase:active, .love-phrase.highlighted {
            transform: translate(-50%, -50%) scale(1.4) !important;
            color: #ffffff !important;
            text-shadow: 0 0 12px var(--theme-primary, #ff2a5f), 0 0 24px var(--theme-primary, #ff2a5f) !important;
            z-index: 50 !important;
            background: rgba(6, 2, 8, 0.9);
        }

        .love-phrase.dimmed {
            opacity: 0.1 !important;
            transform: translate(-50%, -50%) scale(0.6) !important;
        }

        /* Glassmorphism Panel UI */
        .glass-panel {
            background: rgba(18, 8, 22, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
        }

        /* Custom Scrollbars */

            background: #060208;
        }

            background: rgba(255, 42, 95, 0.4);

        }

        :root {
            --theme-primary: #ff2a5f;
            --theme-secondary: #ff7597;
            --theme-glow-color: rgba(255, 42, 95, 0.22);
        }
    </style>
</head>

        let audioCtx = null;

        let wasVideoMutedBeforeSpeech = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playHeartbeatSound(freqMultiplier = 1) {
            initAudio();
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const now = audioCtx.currentTime;
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(55 * freqMultiplier, now);
                osc1.frequency.exponentialRampToValueAtTime(18 * freqMultiplier, now + 0.12);
                gain1.gain.setValueAtTime(0.3, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.12);
            } catch (e) {}
        }

        function speakLanguageText(item) {
            playHeartbeatSound(1.3);
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                // Pause background video sound while speaking
                wasVideoMutedBeforeSpeech = bgVideo.muted;
                bgVideo.muted = true;

                const textToSpeak = item.pron || item.text;
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = item.speechLang || 'en-US';
                utterance.rate = 0.85;

                const restoreVideoAudio = () => {
                    if (!wasVideoMutedBeforeSpeech) {
                        bgVideo.muted = false;
                    }
                };

                utterance.onend = restoreVideoAudio;
                utterance.onerror = restoreVideoAudio;

                window.speechSynthesis.speak(utterance);
            }
        }

        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x, y };
        }

        function generate110HeartPositions() {
            const positions = [];
            const rings = [
                { count: 48, scale: 1.05, yShift: 1.15 },
                { count: 32, scale: 0.82, yShift: 0.95 },
                { count: 18, scale: 0.58, yShift: 0.75 },
                { count: 8,  scale: 0.36, yShift: 0.50 },
                { count: 3,  scale: 0.18, yShift: 0.25 },
                { count: 1,  scale: 0.0,  yShift: 0.0 }
            ];

            const isMobile = window.innerWidth < 640;
            const scaleX = isMobile ? 10.2 : 18.5;
            const scaleY = isMobile ? 9.8 : 17.0;

            rings.forEach((ring, ringIdx) => {
                for (let i = 0; i < ring.count; i++) {
                    const angleOffset = ringIdx * 0.3;
                    const t = (i / ring.count) * Math.PI * 2 + angleOffset;
                    const pt = getHeartPoint(t);

                    positions.push({
                        x: pt.x * scaleX * ring.scale,
                        y: (pt.y + ring.yShift) * scaleY * ring.scale
                    });
                }
            });

            return positions;
        }

        let bgParticles = [];
        const bgCtx = bgCanvas.getContext('2d');

        function initBackgroundCanvas() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            bgParticles = [];
            const totalParticles = Math.floor((bgCanvas.width * bgCanvas.height) / 5000);

            for (let i = 0; i < totalParticles; i++) {
                bgParticles.push({
                    x: Math.random() * bgCanvas.width,
                    y: Math.random() * bgCanvas.height,
                    size: Math.random() * 2 + 0.5,
                    alpha: Math.random(),
                    speedY: - (Math.random() * 0.3 + 0.1),
                    speedX: (Math.random() - 0.5) * 0.15,
                    isHeart: Math.random() < 0.15
                });
            }
        }

        function drawBackground() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            const theme = themes[currentThemeIdx];

            for (let p of bgParticles) {
                p.y += p.speedY;
                p.x += p.speedX;
                if (p.y < 0) p.y = bgCanvas.height;
                if (p.x < 0) p.x = bgCanvas.width;
                if (p.x > bgCanvas.width) p.x = 0;

                bgCtx.save();
                bgCtx.globalAlpha = p.alpha * 0.6;
                if (p.isHeart) {
                    bgCtx.fillStyle = theme.primary;
                    bgCtx.font = `${Math.floor(p.size * 4 + 5)}px sans-serif`;
                    bgCtx.fillText('♥', p.x, p.y);
                } else {
                    bgCtx.beginPath();
                    bgCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    bgCtx.fillStyle = `rgba(255, 230, 240, ${p.alpha})`;
                    bgCtx.fill();
                }
                bgCtx.restore();
            }
            requestAnimationFrame(drawBackground);
        }

        const heartCtx = heartCanvas.getContext('2d');
        let pulseAngle = 0;

        function initHeartCanvas() {
            const rect = heartCanvas.parentElement.getBoundingClientRect();
            heartCanvas.width = rect.width;
            heartCanvas.height = rect.height;
        }

        function drawHeartOutline() {
            heartCtx.clearRect(0, 0, heartCanvas.width, heartCanvas.height);
            
            const centerX = heartCanvas.width / 2;
            const centerY = heartCanvas.height / 2 - 2;
            const isMobile = window.innerWidth < 640;
            const size = Math.min(heartCanvas.width, heartCanvas.height) * (isMobile ? 0.023 : 0.028);

            pulseAngle += 0.015;
            const scale = 1 + Math.sin(pulseAngle) * 0.02;

            heartCtx.save();
            heartCtx.translate(centerX, centerY);
            heartCtx.scale(scale, scale);

            heartCtx.beginPath();
            for (let t = 0; t <= Math.PI * 2; t += 0.03) {
                const pt = getHeartPoint(t);
                const x = pt.x * size * (isMobile ? 9.8 : 11.0);
                const y = (pt.y + 1.2) * size * (isMobile ? 9.2 : 10.4);
                if (t === 0) heartCtx.moveTo(x, y);
                else heartCtx.lineTo(x, y);
            }
            heartCtx.closePath();

            const theme = themes[currentThemeIdx];
            heartCtx.strokeStyle = theme.primary;
            heartCtx.lineWidth = 1.5;
            heartCtx.shadowColor = theme.primary;
            heartCtx.shadowBlur = 12;
            heartCtx.globalAlpha = 0.35;
            heartCtx.stroke();
            heartCtx.restore();

            requestAnimationFrame(drawHeartOutline);
        }

        let revealTimeouts = [];

        function render110Phrases() {
            heartWordsContainer.innerHTML = '';
            revealTimeouts.forEach(clearTimeout);
            revealTimeouts = [];

            const positions = generate110HeartPositions();
            const theme = themes[currentThemeIdx];
            const isMobile = window.innerWidth < 640;

            languagesData.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'love-phrase';
                el.dataset.id = item.id;
                el.dataset.lang = item.lang.toLowerCase();
                el.dataset.text = item.text.toLowerCase();
                el.innerText = item.text;
                el.style.fontFamily = `'${item.font}', sans-serif`;

                const pos = positions[index];
                el.style.left = `calc(50% + ${pos.x}px)`;
                el.style.top = `calc(50% + ${pos.y}px)`;

                let fontSize = isMobile ? '0.48rem' : '0.75rem';
                if (index === 10) fontSize = isMobile ? '0.70rem' : '1.15rem';
                else if (index < 16) fontSize = isMobile ? '0.58rem' : '0.88rem';
                
                el.style.fontSize = fontSize;
                
                const colorRatio = index / languagesData.length;
                el.style.color = index === 10 ? '#ffffff' : (colorRatio > 0.45 ? theme.primary : theme.secondary);

                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openLanguageDetails(item);
                });

                heartWordsContainer.appendChild(el);
            });

            startSequential110Reveal();
        }

        function startSequential110Reveal() {
            const phrases = heartWordsContainer.querySelectorAll('.love-phrase');
            let count = 0;
            progressBar.style.width = '0%';
            counterText.innerText = `0 / 110`;

            phrases.forEach((el, index) => {
                const timeout = setTimeout(() => {
                    el.classList.add('revealed');
                    count++;
                    
                    const progressPct = (count / languagesData.length) * 100;
                    progressBar.style.width = `${progressPct}%`;
                    counterText.innerText = `${count} / 110`;

                    const currentLang = languagesData[index];
                    statusText.innerText = `${currentLang.flag} ${currentLang.lang}: "${currentLang.text}"`;

                    if (count === languagesData.length) {
                        setTimeout(() => {
                            statusText.innerText = "❤️ All 110 languages revealed! Touch any word.";
                        }, 500);
                    }
                }, index * 75 + 80);

                revealTimeouts.push(timeout);
            });
        }

        function openLanguageDetails(item) {
            activeSelectedItem = item;
            speakLanguageText(item);

            detailFlag.innerText = item.flag;
            detailLang.innerText = item.lang;
            detailCountry.innerText = item.country;
            detailText.innerText = item.text;
            detailText.style.fontFamily = `'${item.font}', sans-serif`;
            detailPronunciation.innerText = `Pronunciation: "${item.pron}"`;

            const highlightedPrev = heartWordsContainer.querySelector('.highlighted');
            if (highlightedPrev) highlightedPrev.classList.remove('highlighted');

            const targetEl = heartWordsContainer.querySelector(`[data-id="${item.id}"]`);
            if (targetEl) targetEl.classList.add('highlighted');

            detailModal.classList.remove('hidden');
            setTimeout(() => {
                detailModal.classList.add('opacity-100');
                detailCard.classList.remove('scale-95');
                detailCard.classList.add('scale-100');
            }, 10);
        }

        function closeLanguageDetails() {
            detailModal.classList.remove('opacity-100');
            detailCard.classList.remove('scale-100');
            detailCard.classList.add('scale-95');
            
            const highlighted = heartWordsContainer.querySelector('.highlighted');
            if (highlighted) highlighted.classList.remove('highlighted');

            setTimeout(() => { detailModal.classList.add('hidden'); }, 300);
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const phrases = heartWordsContainer.querySelectorAll('.love-phrase');
            
            if (query.length > 0) {
                btnClearSearch.classList.remove('hidden');
                let matchCount = 0;
                phrases.forEach(el => {
                    if (el.dataset.lang.includes(query) || el.dataset.text.includes(query)) {
                        el.classList.remove('dimmed');
                        el.classList.add('highlighted');
                        matchCount++;
                    } else {
                        el.classList.add('dimmed');
                        el.classList.remove('highlighted');
                    }
                });
                statusText.innerText = `Found ${matchCount} match(es)`;
            } else {
                btnClearSearch.classList.add('hidden');
                phrases.forEach(el => el.classList.remove('dimmed', 'highlighted'));
                statusText.innerText = "❤️ All 110 languages revealed!";
            }
        });

        btnClearSearch.addEventListener('click', () => {
            searchInput.value = '';
            searchInput.dispatchEvent(new Event('input'));
        });

        btnSpeak.addEventListener('click', () => {
            if (activeSelectedItem) speakLanguageText(activeSelectedItem);
        });

        function toggleVideoAudio(forcePlay = false) {
            if (bgVideo.muted || forcePlay) {
                bgVideo.muted = false;
                bgVideo.play().then(() => {
                    musicIcon.className = "fa-solid fa-volume-high text-xs text-pink-400";
                }).catch(e => {});
            } else {
                bgVideo.muted = true;
                musicIcon.className = "fa-solid fa-volume-xmark text-xs text-pink-200";
            }
        }

        btnMusic.addEventListener('click', () => toggleVideoAudio());

        function unlockAudio() {
            if (bgVideo.muted) {
                toggleVideoAudio(true);
            }
        }

        document.body.addEventListener('touchstart', unlockAudio, { once: true });
        document.body.addEventListener('click', unlockAudio, { once: true });

        function populateModalList() {
            modalListContent.innerHTML = '';
            languagesData.forEach((item) => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between p-2 rounded-xl bg-white/5 hover:bg-pink-500/15 transition border border-white/5 cursor-pointer';
                row.innerHTML = `
                    <div class="flex items-center gap-2 truncate">
                        <span class="text-base">${item.flag}</span>
                        <div class="truncate">
                            <p class="font-bold text-white text-[11px] leading-tight">${item.lang}</p>
                            <p class="text-[9px] text-pink-300/60">${item.country}</p>
                        </div>
                    </div>
                    <div class="text-right pl-2">
                        <p class="font-bold text-pink-300 text-xs" style="font-family:'${item.font}'">${item.text}</p>
                    </div>
                `;
                row.addEventListener('click', () => {
                    listModal.classList.remove('opacity-100');
                    setTimeout(() => listModal.classList.add('hidden'), 300);
                    openLanguageDetails(item);
                });
                modalListContent.appendChild(row);
            });
        }

        btnReplay.addEventListener('click', render110Phrases);

        btnTheme.addEventListener('click', () => {
            currentThemeIdx = (currentThemeIdx + 1) % themes.length;
            const theme = themes[currentThemeIdx];
            document.documentElement.style.setProperty('--theme-primary', theme.primary);
            document.documentElement.style.setProperty('--theme-secondary', theme.secondary);
            document.documentElement.style.setProperty('--theme-glow-color', theme.glow);
            render110Phrases();
        });

        btnList.addEventListener('click', () => {
            populateModalList();
            listModal.classList.remove('hidden');
            setTimeout(() => listModal.classList.add('opacity-100'), 10);
        });

        btnCloseList.addEventListener('click', () => {
            listModal.classList.remove('opacity-100');
            setTimeout(() => listModal.classList.add('hidden'), 300);
        });

        btnCloseDetail.addEventListener('click', closeLanguageDetails);

        detailModal.addEventListener('click', (e) => {
            if (e.target === detailModal) closeLanguageDetails();
        });

        listModal.addEventListener('click', (e) => {
            if (e.target === listModal) {
                listModal.classList.remove('opacity-100');
                setTimeout(() => listModal.classList.add('hidden'), 300);
            }
        });

        window.addEventListener('resize', () => {
            initBackgroundCanvas();
            initHeartCanvas();
        });

        window.onload = function() {
            initBackgroundCanvas();
            initHeartCanvas();
            drawBackground();
            drawHeartOutline();
            render110Phrases();
            
            bgVideo.play().then(() => {
                bgVideo.muted = false;
                musicIcon.className = "fa-solid fa-volume-high text-xs text-pink-400";
            }).catch(e => {
                bgVideo.muted = true;
                bgVideo.play();
            });
        };
    </script>
</body>
</html>
